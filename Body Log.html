<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5e9;--card:#fff;--ink:#3b2a1a;--mut:#7a6650;--a:#7b4a22;--a2:#f2b632;--on:#fff;--line:#e8dcc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.mig{--bg:#f3effb;--ink:#2a2147;--mut:#6b6290;--a:#5b3fb5;--a2:#b9a7f0;--line:#ddd5f3}
@media(prefers-color-scheme:dark){
:root{--bg:#1d1610;--card:#2a2018;--ink:#f3e6d2;--mut:#b9a58b;--line:#44352a;--a:#f2b632;--a2:#a86a2c;--on:#2a1a08}
body.mig{--bg:#171329;--card:#221c3a;--ink:#ece8fb;--mut:#aaa3cf;--line:#3a3260;--a:#b9a7f0;--a2:#6d52d0;--on:#1a1233}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .3s}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.3rem;margin:4px 0 12px}
h2{font-size:1rem;margin:0 0 10px;color:var(--a)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font-size:1rem;font-weight:600}
.tabs button.on{background:var(--a);color:var(--on);border-color:var(--a)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{padding:0;accent-color:var(--a)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border:1.5px solid var(--line);border-radius:20px;background:var(--bg);color:var(--ink);font-size:.85rem}
.chip.on{background:var(--a2);border-color:var(--a);color:#2a1a08;font-weight:600}
.big{width:100%;padding:14px;border:0;border-radius:14px;background:var(--a);color:var(--on);font-size:1.05rem;font-weight:700;margin-top:14px}
.ghost{width:100%;padding:12px;border:2px dashed var(--a);border-radius:14px;background:transparent;color:var(--a);font-weight:600;font-size:.95rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.4rem;color:var(--a)}
.stat span{font-size:.75rem;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.row small{color:var(--mut);display:block}
.row button{border:0;background:none;color:var(--mut);font-size:1.1rem}
textarea.rep{height:170px;font-size:.8rem;font-family:ui-monospace,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px}.chk input{width:auto}
.empty{color:var(--mut);font-size:.9rem}
/* refined, iPhone 6s (375x667) */
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2e2118;--mut:#8a7a66;--a:#5a3a22;--a2:#b8913f;--on:#fffdf8;--line:#e6dcc9}
body.mig{--bg:#f1eef3;--card:#fcfbfd;--ink:#271f33;--mut:#7d7590;--a:#4a3568;--a2:#9a86b8;--line:#e0d9e8}
@media(prefers-color-scheme:dark){
:root{--bg:#17110c;--card:#21190f;--ink:#efe4d2;--mut:#a8977d;--line:#3a2e22;--a:#d4ad5e;--a2:#8a6a2e;--on:#17110c}
body.mig{--bg:#14111b;--card:#1d1827;--ink:#ebe6f3;--mut:#a69db8;--line:#342c46;--a:#c4b2e3;--a2:#7d68a3;--on:#14111b}}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,-apple-system,"Helvetica Neue",sans-serif;font-size:15px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
main{max-width:420px;padding:10px 16px 40px}
h1,h2,.stat b,#bd,.scale .br{font-family:"Cormorant Garamond",Georgia,serif}
h1{font-weight:500;font-size:2.1rem;text-align:center;margin:8px 0 4px;letter-spacing:.01em}
h2{font-weight:500;font-size:1.3rem;color:var(--ink);margin-bottom:6px}
.tabs{gap:0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button,.tabs button.on{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mut);min-height:44px}
.tabs button.on{color:var(--a);border-bottom-color:var(--a2)}
.card{border-radius:6px;padding:18px 16px;margin-bottom:16px}
label{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 6px}
input:not([type=checkbox]):not([type=range]),select,textarea{font-size:16px;min-height:44px;min-width:0;max-width:100%;border-radius:4px;background:transparent;-webkit-appearance:none;appearance:none}
textarea{min-height:0}
.chk input{width:22px;height:22px;min-height:0;padding:0}
.two{grid-template-columns:1fr;gap:0}
.big{border-radius:4px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;min-height:48px;margin-top:20px}
.ghost{border:1px solid var(--a2);border-radius:4px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--a);min-height:44px}
.chip{border-radius:3px;background:transparent;color:var(--mut);font-size:.8rem;padding:8px 10px;min-height:38px}
.chip.on{background:var(--a);border-color:var(--a);color:var(--on);font-weight:500}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.scale .br{padding:0;min-height:44px;font-size:1.15rem;text-align:center}
#bd{font-style:italic;color:var(--mut);margin:8px 0 0;min-height:1.4em}
.stat{background:transparent;border:1px solid var(--line);border-radius:4px}
.stat b{font-weight:500;font-size:1.8rem;color:var(--a)}
.stat span{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}
.row{font-size:.88rem}
textarea.rep{font-size:12px}
</style></head>
<body>
<main>
<h1 id="ttl"></h1>
<div class="tabs"><button id="t-stool">Stool</button><button id="t-mig">Migraines</button></div>
<div id="app"></div>
</main>
<script>
var KEY='body-log-v1',db={stool:[],mig:[]},tab='stool',sel={bristol:0,trig:[],aura:false,helped:''};
try{var s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
var $=function(q){return document.querySelector(q)};
function esc(t){return String(t||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nowL(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function fmt(t){return new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})}
function day(t){return Math.floor(new Date(t).setHours(0,0,0,0)/864e5+.5)}
var BR=['Hard lumps','Lumpy sausage','Cracked sausage','Smooth sausage','Soft blobs','Mushy','Liquid'];
var TR=['Poor sleep','Stress','Skipped meal','Dehydration','Hormonal','Weather','Screens','Bright light','Alcohol','Caffeine','Certain food'];
var LOC=['Left side','Right side','Both sides','Behind eyes','Back of head'];
var ago30=function(){return Date.now()-30*864e5};
function avg(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}

function stoolStats(){
 var w=db.stool.filter(function(e){return e.went}).sort(function(a,b){return a.t<b.t?-1:1});
 var r=w.filter(function(e){return new Date(e.t)>=ago30()});
 var days={};r.forEach(function(e){days[day(e.t)]=1});
 var gaps=[];for(var i=1;i<w.length;i++)gaps.push(day(w[i].t)-day(w[i-1].t));
 var since=w.length?day(nowL())-day(w[w.length-1].t):null;
 return{days:Object.keys(days).length,avgGap:avg(gaps),maxGap:gaps.length?Math.max.apply(null,gaps):0,since:since,pain:avg(r.map(function(e){return+e.pain})),blood:r.filter(function(e){return e.blood}).length,strain:r.filter(function(e){return e.strain}).length,bristol:avg(r.filter(function(e){return e.bristol}).map(function(e){return e.bristol}))}}
function migStats(){
 var r=db.mig.filter(function(e){return new Date(e.t)>=ago30()});
 var tc={};r.forEach(function(e){(e.trig||[]).forEach(function(x){tc[x]=(tc[x]||0)+1})});
 var top=Object.keys(tc).sort(function(a,b){return tc[b]-tc[a]}).slice(0,3).map(function(k){return k+' ('+tc[k]+')'});
 var dur=r.filter(function(e){return e.end}).map(function(e){return(new Date(e.end)-new Date(e.t))/36e5}).filter(function(h){return h>0});
 return{n:r.length,sev:avg(r.map(function(e){return+e.sev})),dur:avg(dur),aura:r.filter(function(e){return e.aura}).length,top:top,helped:r.filter(function(e){return e.helped==='yes'}).length,meds:r.filter(function(e){return e.med}).length}}

function report(){
 var L=['BODY LOG – last 30 days (as of '+new Date().toLocaleDateString()+')',''];
 if(tab==='stool'){var s=stoolStats();
  L.push('BOWEL MOVEMENTS','Days with a bowel movement: '+s.days+' of 30','Average gap between movements: '+s.avgGap.toFixed(1)+' days (longest: '+s.maxGap+' days)');
  if(s.since!==null)L.push('Days since last movement: '+s.since);
  L.push('Average Bristol type: '+(s.bristol?s.bristol.toFixed(1):'n/a'),'Average pain: '+s.pain.toFixed(1)+'/10','Entries with straining: '+s.strain,'Entries with blood: '+s.blood,'','ENTRIES');
  db.stool.filter(function(e){return new Date(e.t)>=ago30()}).sort(function(a,b){return a.t<b.t?-1:1}).forEach(function(e){
   L.push(fmt(e.t)+' – '+(e.went?'Bristol '+(e.bristol||'?')+', pain '+e.pain+'/10'+(e.strain?', straining':'')+(e.blood?', BLOOD':''):'No stool')+(e.note?' – '+e.note:''))});
 }else{var m=migStats();
  L.push('MIGRAINES','Migraines: '+m.n,'Average severity: '+m.sev.toFixed(1)+'/10','Average duration: '+(m.dur?m.dur.toFixed(1)+' hours':'n/a'),'With aura: '+m.aura,'Medication taken: '+m.meds+' (helped: '+m.helped+')','Top triggers: '+(m.top.join(', ')||'none logged'),'','ENTRIES');
  db.mig.filter(function(e){return new Date(e.t)>=ago30()}).sort(function(a,b){return a.t<b.t?-1:1}).forEach(function(e){
   L.push(fmt(e.t)+' – severity '+e.sev+'/10'+(e.aura?', aura':'')+(e.loc?', '+e.loc:'')+(e.trig&&e.trig.length?', triggers: '+e.trig.join('/'):'')+(e.med?', took '+e.med+(e.helped?' ('+e.helped+')':''):'')+(e.note?' – '+e.note:''))});
 }
 return L.join('\n')}

function chips(list,cls){return list.map(function(x,i){return'<button type="button" class="chip '+cls+'" data-i="'+i+'">'+x+'</button>'}).join('')}

function render(){
 document.body.className=tab==='mig'?'mig':'';
 $('#t-stool').className=tab==='stool'?'on':'';$('#t-mig').className=tab==='mig'?'on':'';
 $('#ttl').textContent=tab==='stool'?'Stool tracker':'Migraine tracker';
 sel={bristol:0,trig:[],aura:false,helped:''};
 var h='';
 if(tab==='stool'){var s=stoolStats();
  h+='<button class="ghost" id="nostool">Log “no stool today”</button>';
  h+='<div class="card" style="margin-top:14px"><h2>Log a bowel movement</h2><label>When</label><input type="datetime-local" id="when" value="'+nowL()+'">'+
  '<label>Bristol type</label><div class="scale">'+BR.map(function(x,i){return'<button type="button" class="chip br" data-i="'+(i+1)+'">'+(i+1)+'</button>'}).join('')+'</div><div id="bd">1 hard · 4 ideal · 7 liquid</div>'+
  '<label>Pain: <span id="pv">0</span>/10</label><input type="range" id="pain" min="0" max="10" value="0">'+
  '<div class="chk"><input type="checkbox" id="strain"><span>Straining</span></div><div class="chk"><input type="checkbox" id="blood"><span>Blood seen</span></div>'+
  '<label>Notes (food, water, medication…)</label><textarea id="note" rows="2"></textarea><button class="big" id="save">Save entry</button></div>';
  h+='<div class="card"><h2>Doctor summary · last 30 days</h2><div class="stats">'+
  '<div class="stat"><b>'+s.days+'/30</b><span>days with a movement</span></div><div class="stat"><b>'+(s.since===null?'–':s.since+'d')+'</b><span>since last movement</span></div>'+
  '<div class="stat"><b>'+s.avgGap.toFixed(1)+'d</b><span>average gap</span></div><div class="stat"><b>'+s.maxGap+'d</b><span>longest gap</span></div>'+
  '<div class="stat"><b>'+s.pain.toFixed(1)+'</b><span>average pain</span></div><div class="stat"><b>'+s.blood+'</b><span>entries with blood</span></div></div></div>';
  h+=hist(db.stool,function(e){return(e.went?'Bristol '+(e.bristol||'?')+' · pain '+e.pain+(e.strain?' · straining':'')+(e.blood?' · blood':''):'No stool')});
 }else{var m=migStats();
  h+='<div class="card"><h2>Log a migraine</h2><div class="two"><div><label>Started</label><input type="datetime-local" id="when" value="'+nowL()+'"></div><div><label>Ended (optional)</label><input type="datetime-local" id="end"></div></div>'+
  '<label>Severity: <span id="pv">5</span>/10</label><input type="range" id="sev" min="1" max="10" value="5">'+
  '<div class="chk"><input type="checkbox" id="aura"><span>Had aura</span></div>'+
  '<label>Where</label><select id="loc"><option value="">–</option>'+LOC.map(function(x){return'<option>'+x+'</option>'}).join('')+'</select>'+
  '<label>Suspected triggers</label><div class="chips">'+chips(TR,'tg')+'</div>'+
  '<div class="two"><div><label>Medication taken</label><input id="med" placeholder="name / dose"></div><div><label>Did it help?</label><select id="helped"><option value="">–</option><option>yes</option><option>partly</option><option>no</option></select></div></div>'+
  '<label>Notes</label><textarea id="note" rows="2"></textarea><button class="big" id="save">Save migraine</button></div>';
  h+='<div class="card"><h2>Doctor summary · last 30 days</h2><div class="stats">'+
  '<div class="stat"><b>'+m.n+'</b><span>migraines</span></div><div class="stat"><b>'+m.sev.toFixed(1)+'</b><span>average severity</span></div>'+
  '<div class="stat"><b>'+(m.dur?m.dur.toFixed(1)+'h':'–')+'</b><span>average duration</span></div><div class="stat"><b>'+m.aura+'</b><span>with aura</span></div></div>'+
  '<p class="empty">Top triggers: '+(m.top.join(', ')||'none logged yet')+'</p></div>';
  h+=hist(db.mig,function(e){return'Severity '+e.sev+'/10'+(e.aura?' · aura':'')+(e.trig&&e.trig.length?' · '+esc(e.trig.join(', ')):'')});
 }
 h+='<div class="card"><h2>Report for your appointment</h2><textarea class="rep" id="rep" readonly>'+esc(report())+'</textarea><button class="big" id="copy">Copy report</button><p class="empty">Paste it into a message or note to show your doctor. Data is stored only on this device, so copy it now and then as a backup.</p></div>';
 $('#app').innerHTML=h;wire();
}
function hist(arr,desc){
 var h='<div class="card"><h2>History</h2>';
 if(!arr.length)return h+'<p class="empty">Nothing logged yet.</p></div>';
 arr.slice().sort(function(a,b){return a.t<b.t?1:-1}).slice(0,30).forEach(function(e){
  h+='<div class="row"><div>'+fmt(e.t)+'<small>'+desc(e)+(e.note?' · '+esc(e.note):'')+'</small></div><button data-del="'+e.id+'" aria-label="Delete">✕</button></div>'});
 return h+'</div>'}

function wire(){
 var pr=$('#pain')||$('#sev');if(pr)pr.oninput=function(){$('#pv').textContent=pr.value};
 document.querySelectorAll('.br').forEach(function(b){b.onclick=function(){sel.bristol=+b.dataset.i;$('#bd').textContent=sel.bristol+' · '+BR[sel.bristol-1];document.querySelectorAll('.br').forEach(function(x){x.classList.toggle('on',x===b)})}});
 document.querySelectorAll('.tg').forEach(function(b){b.onclick=function(){var t=TR[+b.dataset.i],i=sel.trig.indexOf(t);if(i<0)sel.trig.push(t);else sel.trig.splice(i,1);b.classList.toggle('on')}});
 document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){if(!confirm('Delete this entry?'))return;var k=tab==='stool'?'stool':'mig';db[k]=db[k].filter(function(e){return String(e.id)!==b.dataset.del});save();render()}});
 var ns=$('#nostool');if(ns)ns.onclick=function(){db.stool.push({id:Date.now(),t:nowL(),went:false});save();render()};
 $('#save').onclick=function(){
  var t=$('#when').value||nowL(),note=$('#note').value.trim(),id=Date.now();
  if(tab==='stool')db.stool.push({id:id,t:t,went:true,bristol:sel.bristol,pain:$('#pain').value,strain:$('#strain').checked,blood:$('#blood').checked,note:note});
  else db.mig.push({id:id,t:t,end:$('#end').value,sev:$('#sev').value,aura:$('#aura').checked,loc:$('#loc').value,trig:sel.trig.slice(),med:$('#med').value.trim(),helped:$('#helped').value,note:note});
  save();render();window.scrollTo(0,0)};
 $('#copy').onclick=function(){var r=$('#rep');r.select();r.setSelectionRange(0,99999);try{navigator.clipboard.writeText(r.value)}catch(e){try{document.execCommand('copy')}catch(x){}}this.textContent='Copied ✓';var b=this;setTimeout(function(){b.textContent='Copy report'},1500)};
}
$('#t-stool').onclick=function(){tab='stool';render()};
$('#t-mig').onclick=function(){tab='mig';render()};
render();
</script></body></html>
